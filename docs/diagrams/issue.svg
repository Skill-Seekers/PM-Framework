<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1616 374" width="1616" height="374" role="img" aria-labelledby="t-issue d-issue">
<title id="t-issue">Issue lifecycle</title>
<desc id="d-issue">Issue lifecycle. States: DETECTED, LOGGED, TRIAGED, DECIDED, RESOLVED, CLOSED, DEFERRED. Transitions: issue log (DETECTED to LOGGED); issue triage (LOGGED to TRIAGED); issue decide (TRIAGED to DECIDED); issue resolve (DECIDED to RESOLVED); issue defer (DECIDED to DEFERRED); issue close (RESOLVED to CLOSED); issue retriage (DEFERRED to TRIAGED); issue reopen (CLOSED to TRIAGED).</desc>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
  .initial .box { stroke: #0b5cad; stroke-width: 3; fill: #eaf2fb; }
  .terminal .box { fill: #e1e6eb; stroke: #57606a; stroke-width: 1.5; }
  .state text { fill: #1f2328; font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .edge { fill: none; stroke: #3d4650; stroke-width: 1.8; }
  .edge.back { stroke-dasharray: 7 5; }
  .tip { fill: #3d4650; }
  .lbl rect { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
  .lbl text { fill: #1f2328; font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .lbl.back rect { fill: #fff8e6; }
  .group { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .grouplbl { fill: #57606a; font: 500 11px system-ui, sans-serif; }
  .title { fill: #1f2328; font: 700 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .legend { fill: #57606a; font: 500 11.5px system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #8b949e; }
    .initial .box { stroke: #58a6ff; fill: #12233a; }
    .terminal .box { fill: #21262d; stroke: #8b949e; }
    .state text { fill: #e6edf3; }
    .edge { stroke: #b6bec8; }
    .tip { fill: #b6bec8; }
    .lbl rect { fill: #0d1117; stroke: #6e7681; }
    .lbl text { fill: #e6edf3; }
    .lbl.back rect { fill: #2a2110; }
    .group { stroke: #6e7681; }
    .grouplbl, .legend { fill: #9da7b3; }
    .title { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah-issue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1616" height="374"/>
<text class="title" x="56" y="34">Issue lifecycle</text>
<text class="legend" x="56" y="356">Blue outline = starts here. Grey fill = end state. Solid arrow = forward step. Dashed arrow = loop back. Hover an arrow for its guards.</text>
<g><title>issue close: RESOLVED -&gt; CLOSED
guards: brief_present_if_required, lesson_present</title><path class="edge" d="M1292,121 L1396,121" marker-end="url(#ah-issue)"/><g class="lbl"><rect x="1319.5" y="111" width="49" height="20" rx="10"/><text x="1344" y="125" text-anchor="middle">close</text></g></g>
<g><title>issue decide: TRIAGED -&gt; DECIDED
guards: decision_chosen, decision_signed_if_waive_or_defer</title><path class="edge" d="M756,121 L860,121" marker-end="url(#ah-issue)"/><g class="lbl"><rect x="780" y="111" width="56" height="20" rx="10"/><text x="808" y="125" text-anchor="middle">decide</text></g></g>
<g><title>issue defer: DECIDED -&gt; DEFERRED
guards: option_is_defer, customer_acceptance_if_customer_visible</title><path class="edge" d="M942,146 L942,228" marker-end="url(#ah-issue)"/><g class="lbl"><rect x="917.5" y="177" width="49" height="20" rx="10"/><text x="942" y="191" text-anchor="middle">defer</text></g></g>
<g><title>issue log: DETECTED -&gt; LOGGED
guards: has_required_fields, single_owner, valid_severity, valid_phase</title><path class="edge" d="M220,121 L324,121" marker-end="url(#ah-issue)"/><g class="lbl"><rect x="254.5" y="111" width="35" height="20" rx="10"/><text x="272" y="125" text-anchor="middle">log</text></g></g>
<g><title>issue reopen: CLOSED -&gt; TRIAGED
guards: reason_present</title><path class="edge back" d="M1478,96 L1478,58.5 L674,58.5 L674,96" marker-end="url(#ah-issue)"/><g class="lbl back"><rect x="1048" y="48.5" width="56" height="20" rx="10"/><text x="1076" y="62.5" text-anchor="middle">reopen</text></g></g>
<g><title>issue resolve: DECIDED -&gt; RESOLVED
guards: option_is_fix_or_waive, verification_ref_present</title><path class="edge" d="M1024,121 L1128,121" marker-end="url(#ah-issue)"/><g class="lbl"><rect x="1044.5" y="111" width="63" height="20" rx="10"/><text x="1076" y="125" text-anchor="middle">resolve</text></g></g>
<g><title>issue retriage: DEFERRED -&gt; TRIAGED
guards: reason_present</title><path class="edge back" d="M860,253 L674,253 L674,146" marker-end="url(#ah-issue)"/><g class="lbl back"><rect x="732" y="243" width="70" height="20" rx="10"/><text x="767" y="257" text-anchor="middle">retriage</text></g></g>
<g><title>issue triage: LOGGED -&gt; TRIAGED
guards: decision_record_has_three_options, decision_record_has_recommendation</title><path class="edge" d="M488,121 L592,121" marker-end="url(#ah-issue)"/><g class="lbl"><rect x="512" y="111" width="56" height="20" rx="10"/><text x="540" y="125" text-anchor="middle">triage</text></g></g>
<g class="state initial"><rect class="box" x="56" y="96" width="164" height="50" rx="10"/><text x="138" y="125.5" text-anchor="middle">DETECTED</text></g>
<g class="state"><rect class="box" x="324" y="96" width="164" height="50" rx="10"/><text x="406" y="125.5" text-anchor="middle">LOGGED</text></g>
<g class="state"><rect class="box" x="592" y="96" width="164" height="50" rx="10"/><text x="674" y="125.5" text-anchor="middle">TRIAGED</text></g>
<g class="state"><rect class="box" x="860" y="96" width="164" height="50" rx="10"/><text x="942" y="125.5" text-anchor="middle">DECIDED</text></g>
<g class="state"><rect class="box" x="1128" y="96" width="164" height="50" rx="10"/><text x="1210" y="125.5" text-anchor="middle">RESOLVED</text></g>
<g class="state terminal"><rect class="box" x="1396" y="96" width="164" height="50" rx="10"/><text x="1478" y="125.5" text-anchor="middle">CLOSED</text></g>
<g class="state"><rect class="box" x="860" y="228" width="164" height="50" rx="10"/><text x="942" y="257.5" text-anchor="middle">DEFERRED</text></g>
</svg>
