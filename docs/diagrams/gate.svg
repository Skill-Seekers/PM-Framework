<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 506" width="1080" height="506" role="img" aria-labelledby="t-gate d-gate">
<title id="t-gate">Gate lifecycle</title>
<desc id="d-gate">Gate lifecycle. States: PLANNED, REVIEW, GO, CONDITIONAL_GO, NO_GO. Transitions: gate review (PLANNED to REVIEW); gate go (REVIEW to GO); gate conditional (REVIEW to CONDITIONAL_GO); gate nogo (REVIEW to NO_GO); gate review (NO_GO to REVIEW).</desc>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
  .initial .box { stroke: #0b5cad; stroke-width: 3; fill: #eaf2fb; }
  .terminal .box { fill: #e1e6eb; stroke: #57606a; stroke-width: 1.5; }
  .state text { fill: #1f2328; font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .edge { fill: none; stroke: #3d4650; stroke-width: 1.8; }
  .edge.back { stroke-dasharray: 7 5; }
  .tip { fill: #3d4650; }
  .lbl rect { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
  .lbl text { fill: #1f2328; font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .lbl.back rect { fill: #fff8e6; }
  .group { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .grouplbl { fill: #57606a; font: 500 11px system-ui, sans-serif; }
  .title { fill: #1f2328; font: 700 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .legend { fill: #57606a; font: 500 11.5px system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #8b949e; }
    .initial .box { stroke: #58a6ff; fill: #12233a; }
    .terminal .box { fill: #21262d; stroke: #8b949e; }
    .state text { fill: #e6edf3; }
    .edge { stroke: #b6bec8; }
    .tip { fill: #b6bec8; }
    .lbl rect { fill: #0d1117; stroke: #6e7681; }
    .lbl text { fill: #e6edf3; }
    .lbl.back rect { fill: #2a2110; }
    .group { stroke: #6e7681; }
    .grouplbl, .legend { fill: #9da7b3; }
    .title { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1080" height="506"/>
<text class="title" x="56" y="34">Gate lifecycle</text>
<text class="legend" x="56" y="488">Blue outline = starts here. Grey fill = end state. Solid arrow = forward step. Dashed arrow = loop back. Hover an arrow for its guards.</text>
<g><title>gate conditional: REVIEW -&gt; CONDITIONAL_GO
guards: waiver_for_each_unmet_criterion, no_blocking_open_issues</title><path class="edge" d="M488,253 L860,253" marker-end="url(#ah-gate)"/><g class="lbl"><rect x="628.5" y="243" width="91" height="20" rx="10"/><text x="674" y="257" text-anchor="middle">conditional</text></g></g>
<g><title>gate go: REVIEW -&gt; GO
guards: all_criteria_met, no_blocking_open_issues</title><path class="edge" d="M488,253 L860,121" marker-end="url(#ah-gate)"/><g class="lbl"><rect x="701.6" y="161.2" width="34" height="20" rx="10"/><text x="718.6" y="175.2" text-anchor="middle">go</text></g></g>
<g><title>gate nogo: REVIEW -&gt; NO_GO
guards: issue_logged_for_each_unmet_criterion</title><path class="edge" d="M488,253 L860,385" marker-end="url(#ah-gate)"/><g class="lbl"><rect x="697.6" y="324.8" width="42" height="20" rx="10"/><text x="718.6" y="338.8" text-anchor="middle">nogo</text></g></g>
<g><title>gate review: NO_GO -&gt; REVIEW
guards: reason_present</title><path class="edge back" d="M942,410 L942,440 L406,440 L406,278" marker-end="url(#ah-gate)"/><g class="lbl back"><rect x="646" y="430" width="56" height="20" rx="10"/><text x="674" y="444" text-anchor="middle">review</text></g></g>
<g><title>gate review: PLANNED -&gt; REVIEW
guards: exit_criteria_listed</title><path class="edge" d="M220,253 L324,253" marker-end="url(#ah-gate)"/><g class="lbl"><rect x="244" y="243" width="56" height="20" rx="10"/><text x="272" y="257" text-anchor="middle">review</text></g></g>
<g class="state initial"><rect class="box" x="56" y="228" width="164" height="50" rx="10"/><text x="138" y="257.5" text-anchor="middle">PLANNED</text></g>
<g class="state"><rect class="box" x="324" y="228" width="164" height="50" rx="10"/><text x="406" y="257.5" text-anchor="middle">REVIEW</text></g>
<g class="state terminal"><rect class="box" x="860" y="96" width="164" height="50" rx="10"/><text x="942" y="125.5" text-anchor="middle">GO</text></g>
<g class="state terminal"><rect class="box" x="860" y="228" width="164" height="50" rx="10"/><text x="942" y="257.5" text-anchor="middle">CONDITIONAL_GO</text></g>
<g class="state"><rect class="box" x="860" y="360" width="164" height="50" rx="10"/><text x="942" y="389.5" text-anchor="middle">NO_GO</text></g>
</svg>
