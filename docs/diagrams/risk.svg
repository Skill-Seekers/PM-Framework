<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1214 374" width="1214" height="374" role="img" aria-labelledby="t-risk d-risk">
<title id="t-risk">Risk lifecycle</title>
<desc id="d-risk">Risk lifecycle. States: IDENTIFIED, ASSESSED, MITIGATING, ACCEPTED, OCCURRED, RETIRED. Transitions: risk assess (IDENTIFIED to ASSESSED); risk mitigate (ASSESSED to MITIGATING); risk accept (ASSESSED to ACCEPTED); risk occur (ASSESSED to OCCURRED); risk occur (MITIGATING to OCCURRED); risk occur (ACCEPTED to OCCURRED); risk retire (MITIGATING to RETIRED); risk retire (ACCEPTED to RETIRED); risk retire (ASSESSED to RETIRED).</desc>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
  .initial .box { stroke: #0b5cad; stroke-width: 3; fill: #eaf2fb; }
  .terminal .box { fill: #e1e6eb; stroke: #57606a; stroke-width: 1.5; }
  .state text { fill: #1f2328; font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .edge { fill: none; stroke: #3d4650; stroke-width: 1.8; }
  .edge.back { stroke-dasharray: 7 5; }
  .tip { fill: #3d4650; }
  .lbl rect { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
  .lbl text { fill: #1f2328; font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .lbl.back rect { fill: #fff8e6; }
  .group { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .grouplbl { fill: #57606a; font: 500 11px system-ui, sans-serif; }
  .title { fill: #1f2328; font: 700 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .legend { fill: #57606a; font: 500 11.5px system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #8b949e; }
    .initial .box { stroke: #58a6ff; fill: #12233a; }
    .terminal .box { fill: #21262d; stroke: #8b949e; }
    .state text { fill: #e6edf3; }
    .edge { stroke: #b6bec8; }
    .tip { fill: #b6bec8; }
    .lbl rect { fill: #0d1117; stroke: #6e7681; }
    .lbl text { fill: #e6edf3; }
    .lbl.back rect { fill: #2a2110; }
    .group { stroke: #6e7681; }
    .grouplbl, .legend { fill: #9da7b3; }
    .title { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1214" height="374"/>
<text class="title" x="56" y="34">Risk lifecycle</text>
<text class="legend" x="56" y="356">Blue outline = starts here. Grey fill = end state. Solid arrow = forward step. Dashed arrow = loop back. Hover an arrow for its guards.</text>
<rect class="group" x="306" y="70" width="468" height="226" rx="14"/>
<text class="grouplbl" x="318" y="87">any one of these</text>
<g><title>risk accept: ASSESSED -&gt; ACCEPTED
guards: acceptor_named</title><path class="edge" d="M406,146 L592,253" marker-end="url(#ah-risk)"/><g class="lbl"><rect x="471" y="189.5" width="56" height="20" rx="10"/><text x="499" y="203.5" text-anchor="middle">accept</text></g></g>
<g><title>risk assess: IDENTIFIED -&gt; ASSESSED
guards: single_owner, valid_probability, valid_impact</title><path class="edge" d="M220,121 L324,121" marker-end="url(#ah-risk)"/><g class="lbl"><rect x="244" y="111" width="56" height="20" rx="10"/><text x="272" y="125" text-anchor="middle">assess</text></g></g>
<g><title>risk mitigate: ASSESSED -&gt; MITIGATING
guards: mitigation_present</title><path class="edge" d="M488,121 L592,121" marker-end="url(#ah-risk)"/><g class="lbl"><rect x="505" y="111" width="70" height="20" rx="10"/><text x="540" y="125" text-anchor="middle">mitigate</text></g></g>
<g><title>risk occur: from any of ASSESSED, MITIGATING, ACCEPTED -&gt; OCCURRED
guards: linked_issue_exists</title><path class="edge" d="M774,137.8 L978,137.8 L978,121 L994,121" marker-end="url(#ah-risk)"/><g class="lbl"><rect x="851.5" y="127.8" width="49" height="20" rx="10"/><text x="876" y="141.8" text-anchor="middle">occur</text></g></g>
<g><title>risk retire: from any of ASSESSED, MITIGATING, ACCEPTED -&gt; RETIRED
guards: reason_present</title><path class="edge" d="M774,228.2 L978,228.2 L978,253 L994,253" marker-end="url(#ah-risk)"/><g class="lbl"><rect x="848" y="218.2" width="56" height="20" rx="10"/><text x="876" y="232.2" text-anchor="middle">retire</text></g></g>
<g class="state initial"><rect class="box" x="56" y="96" width="164" height="50" rx="10"/><text x="138" y="125.5" text-anchor="middle">IDENTIFIED</text></g>
<g class="state"><rect class="box" x="324" y="96" width="164" height="50" rx="10"/><text x="406" y="125.5" text-anchor="middle">ASSESSED</text></g>
<g class="state"><rect class="box" x="592" y="96" width="164" height="50" rx="10"/><text x="674" y="125.5" text-anchor="middle">MITIGATING</text></g>
<g class="state"><rect class="box" x="592" y="228" width="164" height="50" rx="10"/><text x="674" y="257.5" text-anchor="middle">ACCEPTED</text></g>
<g class="state terminal"><rect class="box" x="994" y="96" width="164" height="50" rx="10"/><text x="1076" y="125.5" text-anchor="middle">OCCURRED</text></g>
<g class="state terminal"><rect class="box" x="994" y="228" width="164" height="50" rx="10"/><text x="1076" y="257.5" text-anchor="middle">RETIRED</text></g>
</svg>
